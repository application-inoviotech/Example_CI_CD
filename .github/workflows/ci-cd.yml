name: React Native CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  setup:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # ← updated from v2

      - name: Set up Node.js
        uses: actions/setup-node@v4 # ← updated from v2
        with:
          node-version: '18' # ← 14 is EOL → upgrade to 18 (LTS) or 20/22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci                      # prefer ci over install for CI
          cd ios && pod install && cd ..

      - name: Run tests
        run: npm test

  build_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease
          cd ..

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4 # ← critical: v2 → v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd ios && pod install && cd ..

      - name: Build iOS archive
        run: |
          cd ios
          xcodebuild -workspace YourApp.xcworkspace \
            -scheme YourApp \
            -sdk iphoneos \
            -configuration Release \
            archive \
            -archivePath "$PWD/build/YourApp.xcarchive"

          xcodebuild -exportArchive \
            -archivePath "$PWD/build/YourApp.xcarchive" \
            -exportPath "$PWD/build/ipa" \
            -exportOptionsPlist YourApp/ExportOptions.plist
          cd ..

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/build/ipa/*.ipa
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [build_android, build_ios] # ← wait for both builds

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4 # ← v2 → v4
        with:
          name: android-apk

      - name: Deploy to Google Play (Android)
        run: |
          # Replace with your real deployment logic (fastlane, etc.)
          echo "Deploying Android APK..."
          # fastlane supply --apk android-apk/app-release.apk   # example

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa

      - name: Deploy to App Store (iOS)
        run: |
          # Replace with your real deployment logic (fastlane, etc.)
          echo "Deploying iOS IPA..."
          # fastlane deliver --ipa ios-ipa/*.ipa   # example
