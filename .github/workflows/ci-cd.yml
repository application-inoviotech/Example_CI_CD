name: React Native CI/CD Pipeline

on:
  push:
    branches:
      - main # Trigger on pushing to the main branch

jobs:
  setup:
    runs-on: macos-latest # Use macOS for iOS builds (use ubuntu-latest for Android)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14' # Specify the Node.js version to use

      - name: Install dependencies
        run: |
          npm install
          cd ios && pod install && cd ..

      - name: Run tests
        run: npm test # Make sure you have tests configured for your project

  build_android:
    runs-on: ubuntu-latest # Android builds work on Ubuntu runners

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease  # For release build
          cd ..

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v2
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  build_ios:
    runs-on: macos-latest # iOS builds require macOS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: |
          npm install
          cd ios && pod install && cd ..

      - name: Build iOS app
        run: |
          cd ios
          xcodebuild -workspace YourApp.xcworkspace -scheme YourApp -sdk iphoneos -configuration Release archive -archivePath $PWD/build/YourApp.xcarchive
          xcodebuild -exportArchive -archivePath $PWD/build/YourApp.xcarchive -exportPath $PWD/build/ipa -exportOptionsPlist $PWD/YourApp/ExportOptions.plist
          cd ..

      - name: Upload iOS IPA as artifact
        uses: actions/upload-artifact@v2
        with:
          name: ios-ipa
          path: ios/build/ipa/*.ipa

  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v2
        with:
          name: android-apk

      - name: Deploy to Google Play (for Android)
        run: |
          # Add your deployment script to Google Play Store
          # You can use Fastlane for Android deployment automation:
          # https://fastlane.tools/
          fastlane supply --apk android/app/build/outputs/apk/release/app-release.apk

      - name: Download iOS IPA
        uses: actions/download-artifact@v2
        with:
          name: ios-ipa

      - name: Deploy to App Store (for iOS)
        run: |
          # Add your deployment script to the App Store
          # You can use Fastlane for iOS deployment automation:
          # https://fastlane.tools/
          fastlane deliver --ipa ios/build/ipa/*.ipa
