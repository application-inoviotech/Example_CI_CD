name: React Native CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  setup:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd ios && pod install && cd ..

      - name: Run tests
        run: npm test

