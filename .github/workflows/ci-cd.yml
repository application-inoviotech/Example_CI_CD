  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # This is optional but harmless — ensures the folder exists if Metro needs to write there
      - name: Ensure Android assets directory exists
        run: mkdir -p android/app/src/main/assets

      # NO manual bundle step here — remove it completely
      # Gradle will run Metro bundling during assembleRelease

      - name: Build Android APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace --info   # --stacktrace + --info = better debug logs if fails
          cd ..

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

