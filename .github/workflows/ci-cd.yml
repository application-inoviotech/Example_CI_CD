      - name: Build iOS archive
        run: |
          cd ios
          xcodebuild -workspace Example_CI_CD.xcworkspace \   # ← CHANGE TO YOUR REAL WORKSPACE NAME
            -scheme Example_CI_CD \                           # ← CHANGE TO YOUR REAL SCHEME NAME
            -sdk iphoneos \
            -configuration Release \
            archive \
            -archivePath "$PWD/build/Example_CI_CD.xcarchive"  # ← optional: match name

          xcodebuild -exportArchive \
            -archivePath "$PWD/build/Example_CI_CD.xcarchive" \
            -exportPath "$PWD/build/ipa" \
            -exportOptionsPlist Example_CI_CD/ExportOptions.plist   # ← CHANGE if plist is in different subfolder
          cd ..
  deploy:
    runs-on: ubuntu-latest
    needs: [build_android, build_ios]

